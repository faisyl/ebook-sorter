version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    volumes:
      - /my/books:/books
      - /my/sorted:/output
      - es-data:/data
    environment:
      - APP_USER=admin
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD (e.g. in a .env file) before starting this service}
      - APP_SECRET=${APP_SECRET:?Set APP_SECRET (e.g. in a .env file) before starting this service}
      - PORT=8080
    restart: unless-stopped

volumes:
  es-data:
