version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    volumes:
      - /my/books:/books
      - /my/sorted:/output
      - es-data:/data
    environment:
      - APP_USER=admin
      - APP_PASSWORD=changeme
      - APP_SECRET=change-me-in-production
      - PORT=8080
    restart: unless-stopped

volumes:
  es-data:
